# Aegivanta Automated Master CI Pipeline & Evidence Verification
name: Aegivanta CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    name: Backend Lint, Environment Verification & PyTest Suite
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-test-secret-key-32-chars-long-minimum!"
      AEGIVANTA_ADMIN_PASSWORD: "TestAdminPassword2026!"
      AEGIVANTA_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      AEGIVANTA_VIEWER_PASSWORD: "TestViewerPassword2026!"
      SENTINEL_ADMIN_PASSWORD: "TestAdminPassword2026!"
      SENTINEL_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      SENTINEL_VIEWER_PASSWORD: "TestViewerPassword2026!"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Authoritative Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Environment & Scikit-Learn 1.6.1 Compatibility
        run: |
          python --version
          python -c "import sklearn; print(f'scikit-learn version: {sklearn.__version__}'); assert sklearn.__version__.startswith('1.6.'), 'Must use scikit-learn 1.6.x'"
          python scripts/verify_environment.py

      - name: Python Compileall Check
        run: |
          python -m compileall -q backend ml scripts tests

      - name: Run Artifact Integrity & Security Audit
        run: |
          python scripts/final_integrity_audit.py

      - name: Validate Kubernetes Manifests Offline
        run: |
          python scripts/validate_k8s_manifests.py

      - name: Run PyTest Test Suite
        run: |
          python -m pytest -q

  frontend-checks:
    name: Frontend TypeCheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run TypeScript TypeCheck & Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-build-checks:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      OPERATING_MODE: PRODUCTION
      POSTGRES_USER: aegivanta_admin
      POSTGRES_PASSWORD: "ci_postgres_password_test"
      POSTGRES_DB: aegivanta_db
      SECRET_KEY: "ci_secret_key_minimum_32_characters_long"
      AEGIVANTA_ADMIN_PASSWORD: "TestAdminPassword2026!"
      AEGIVANTA_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      AEGIVANTA_VIEWER_PASSWORD: "TestViewerPassword2026!"
      SENTINEL_ADMIN_PASSWORD: "TestAdminPassword2026!"
      SENTINEL_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      SENTINEL_VIEWER_PASSWORD: "TestViewerPassword2026!"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config

      - name: Verify Missing Required Variables Fail Closed
        run: |
          if env -u APP_ENV docker compose -f docker/docker-compose.yml config >/dev/null 2>&1; then
            echo "ERROR: Docker Compose unexpectedly accepted missing APP_ENV"
            exit 1
          fi
          echo "Verified: Docker Compose correctly fails closed when required environment variables are unset."

  optional-live-k8s-validation:
    name: Optional Live Kubernetes Server-Side Validation
    runs-on: ubuntu-latest
    if: ${{ vars.LIVE_K8S_VALIDATION == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight Kubernetes Environment Check
        run: |
          python scripts/preflight_kubernetes.py || exit_code=$?
          if [ "${exit_code:-0}" -eq 2 ]; then
            echo "::notice ::Kubernetes environment unavailable -- skipping live cluster validation."
            exit 0
          elif [ "${exit_code:-0}" -ne 0 ]; then
            echo "::error ::Kubernetes preflight failed with critical error."
            exit 1
          fi

      - name: Run Server-Side Manifest Dry-Run Validation
        run: |
          python scripts/validate_k8s_live.py
