name: SentinelAI CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-checks:
    name: Backend Lint, Environment Verification & PyTest Suite
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-test-secret-key-32-chars-long-minimum!"
      SENTINEL_ADMIN_PASSWORD: "TestAdminPassword2026!"
      SENTINEL_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      SENTINEL_VIEWER_PASSWORD: "TestViewerPassword2026!"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Authoritative Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Environment & Scikit-Learn 1.6.1 Compatibility
        run: |
          python --version
          python -c "import sklearn; print(f'scikit-learn version: {sklearn.__version__}'); assert sklearn.__version__.startswith('1.6.'), 'Must use scikit-learn 1.6.x'"
          python scripts/verify_environment.py

      - name: Python Compileall Check
        run: |
          python -m compileall -q backend ml scripts tests

      - name: Run Artifact Integrity & Security Audit
        run: |
          python scripts/final_integrity_audit.py

      - name: Run PyTest Test Suite
        run: |
          python -m pytest -q

  frontend-checks:
    name: Frontend TypeCheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run TypeScript TypeCheck & Build
        working-directory: ./frontend
        run: |
          npm run build

  docker-build-checks:
    name: Docker Configuration Validation
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      OPERATING_MODE: PRODUCTION
      POSTGRES_USER: sentinel_admin
      POSTGRES_PASSWORD: "ci_postgres_password_test"
      POSTGRES_DB: sentinelai_db
      SECRET_KEY: "ci_secret_key_minimum_32_characters_long"
      SENTINEL_ADMIN_PASSWORD: "TestAdminPassword2026!"
      SENTINEL_ANALYST_PASSWORD: "TestAnalystPassword2026!"
      SENTINEL_VIEWER_PASSWORD: "TestViewerPassword2026!"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config

      - name: Verify Missing Required Variables Fail Closed
        run: |
          if env -u APP_ENV docker compose -f docker/docker-compose.yml config >/dev/null 2>&1; then
            echo "ERROR: Docker Compose unexpectedly accepted missing APP_ENV"
            exit 1
          fi
          echo "Verified: Docker Compose correctly fails closed when required environment variables are unset."
