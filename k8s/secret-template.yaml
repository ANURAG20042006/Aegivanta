apiVersion: v1
kind: Secret
metadata:
  name: sentinelai-secrets
  namespace: sentinelai
  labels:
    app.kubernetes.io/name: sentinelai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace placeholders with KMS/Vault-injected values during CI/CD deployment
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_MIN_32_CHARS_LONG_HEX_SECRET"
  DATABASE_URL: "postgresql+asyncpg://sentinel_admin:CHANGE_ME_STRONG_PASSWORD@sentinelai-db:5432/sentinelai_db"
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@sentinelai-redis:6379/0"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  AEGIVANTA_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  AEGIVANTA_ANALYST_PASSWORD: "CHANGE_ME_ANALYST_PASSWORD"
  AEGIVANTA_VIEWER_PASSWORD: "CHANGE_ME_VIEWER_PASSWORD"
  SENTINEL_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  SENTINEL_ANALYST_PASSWORD: "CHANGE_ME_ANALYST_PASSWORD"
  SENTINEL_VIEWER_PASSWORD: "CHANGE_ME_VIEWER_PASSWORD"
