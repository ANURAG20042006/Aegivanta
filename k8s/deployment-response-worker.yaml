apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-response-worker
  namespace: sentinelai
  labels:
    app.kubernetes.io/name: sentinelai
    app.kubernetes.io/component: response-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai
      app.kubernetes.io/component: response-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai
        app.kubernetes.io/component: response-worker
    spec:
      serviceAccountName: sentinelai-sa
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: response-worker
          image: sentinelai/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "backend.app.response_worker"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: sentinelai-config
            - secretRef:
                name: sentinelai-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
