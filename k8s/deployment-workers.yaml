---
# sentinelai Detection Worker - dedicated ML+rules processing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelai-detection-worker
  namespace: sentinelai
  labels:
    app.kubernetes.io/name: sentinelai
    app.kubernetes.io/component: detection-worker
    app.kubernetes.io/version: "3.11"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelai
      app.kubernetes.io/component: detection-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelai
        app.kubernetes.io/component: detection-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinelai-sa
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detection-worker
          image: sentinelai/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "backend.workers.detection_worker"
          env:
            - name: SENTINELAI_WORKER_ROLE
              value: "detection"
          envFrom:
            - configMapRef:
                name: sentinelai-config
            - secretRef:
                name: sentinelai-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: logs-dir
              mountPath: /app/logs
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: logs-dir
          emptyDir: {}
