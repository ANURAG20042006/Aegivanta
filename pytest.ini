[pytest]
minversion = 7.0
addopts = -ra
testpaths = tests
asyncio_mode = auto
markers =
    slow: Tests that perform extensive cross-validation, model training, or large scans (> 10s)
    research: ML leakage proof, dataset provenance, and research integrity tests
    unit: Fast, isolated unit tests
    integration: Multi-service operational pipeline and API integration tests
    security: RBAC, cryptographic token, and credential security tests
    deployment: Kubernetes manifests, container hardening, and cluster deployment tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:sklearn.*
    ignore::RuntimeWarning:sklearn.*
